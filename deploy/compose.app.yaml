services:
  app:
    image: ${APP_IMAGE:?Set the verified release image}
    restart: unless-stopped
    user: '10001:10001'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/nawyki
      SPRING_DATASOURCE_USERNAME: nawyki
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      APP_RELEASE: ${APP_RELEASE:?Set the release commit}
    secrets:
      - source: app_runtime_password
        target: spring.datasource.password
    depends_on:
      db:
        condition: service_healthy
    networks: [edge, database]
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/api/health/ready']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

secrets:
  app_runtime_password:
    file: ./secrets/app_runtime_password
